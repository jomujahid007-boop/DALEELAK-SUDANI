  <text x="121" y="153" font-size="31" font-weight="700">محمد رسول الله</text>
  <path d="M60 181h127" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <path d="M76 195h100" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
 </g>
</g>
<!-- Main brand -->
<g text-anchor="middle" font-family="Tahoma,Arial,sans-serif" filter="url(#shadow)">
 <path d="M570 170 Q900 45 1230 170" fill="none" stroke="#0a7046" stroke-width="7" stroke-linecap="round"/>
 <path d="M900 25c-47 0-83 37-83 83 0 58 83 129 83 129s83-71 83-129c0-46-36-83-83-83Z" fill="url(#green)" stroke="#fff" stroke-width="8"/>
 <path d="M862 127h18V90h12v37h15V72h13v55h13V99h12v28h14v20h-97Z" fill="#fff" opacity=".96"/>
 <text x="900" y="335" font-size="145" font-weight="900" fill="#06452f" stroke="#fff" stroke-width="3" paint-order="stroke">دليلك</text>
