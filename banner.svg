<rect x="520" y="440" width="760" height="112" rx="56" fill="#03442e" stroke="url(#gold)" stroke-width="4" filter="url(#shadow)"/>
<text x="900" y="512" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="48" font-weight="900" fill="#fff">كل خدماتك .. في مكان واحد</text>
