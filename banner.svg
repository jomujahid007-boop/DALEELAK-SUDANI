<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 600" role="img" aria-labelledby="title desc">
<title id="title">دليلك — كل خدماتك في مكان واحد</title>
<desc id="desc">بانر دليلك بخلفية أفق مدينة الرياض وعلم المملكة العربية السعودية فقط على الجهة اليمنى.</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#69b8e9"/><stop offset=".58" stop-color="#f8d8b6"/><stop offset="1" stop-color="#f3bd72"/></linearGradient>
 <linearGradient id="sunset" x2="0" y2="1"><stop stop-color="#fff3d7" stop-opacity="0"/><stop offset="1" stop-color="#f3a84e" stop-opacity=".7"/></linearGradient>
 <linearGradient id="green" x2="0" y2="1"><stop stop-color="#087b49"/><stop offset="1" stop-color="#03442e"/></linearGradient>
 <linearGradient id="gold"><stop stop-color="#b98c37"/><stop offset=".5" stop-color="#f4d27c"/><stop offset="1" stop-color="#b98c37"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#092f22" flood-opacity=".25"/></filter>
 <pattern id="windows" width="18" height="24" patternUnits="userSpaceOnUse"><rect x="5" y="5" width="5" height="9" rx="1" fill="#f7d88e" opacity=".75"/></pattern>
</defs>
<rect width="1800" height="600" fill="url(#sky)"/>
<circle cx="270" cy="115" r="90" fill="#fff4d8" opacity=".24"/>
<path d="M0 320 Q260 280 500 325T980 300T1400 310T1800 270V600H0Z" fill="url(#sunset)"/>
